<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>遊び場 - 卓上鯨観測所</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="../style.css">
  <script src="../js/header.js"></script>
</head>
<body>
  <div id="header-placeholder"></div>

  <main class="site-main">
    <div class="container">
      <article class="article">
        <header>
          <h1>遊び場</h1>
          <time datetime="2026-01-01">2026-01-01</time>
        </header>

        <p>レイアウト確認用記事。<br>自由に書き換えよう！</p>

        <h2>画像の例</h2>
        <p>画像ファイルは <code>assets/img/</code> 以下に置いて、パスを指定する</p>
        <p>classを指定することで、画像のサイズを調整可能</p>
        <img src="../assets/img/sample.png" alt="サンプル画像:small" class="img-small">
        <img src="../assets/img/sample.png" alt="サンプル画像:medium" class="img-medium">
        <img src="../assets/img/sample.png" alt="サンプル画像:large" class="img-large">

        <p>youtube埋め込みの例。youtube-wrapperクラスを指定すること</p>
        <div class="youtube-wrapper">
          <iframe src="https://www.youtube.com/embed/kd_YdNG4O64?si=WSO7uGcrzazUpbL9" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
      </article>
    </div>
  </main>

</body>
</html>
